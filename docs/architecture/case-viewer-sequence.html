<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Viewer — Request Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --accent: #eb6c36; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'Geist', sans-serif; padding: 3rem 2rem; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: 'Instrument Serif', serif; font-size: 2.5rem; font-weight: 400; margin: 0.5rem 0 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
  svg { display: block; width: 100%; height: auto; }
  .colophon { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(45,49,66,0.12); font-family: 'Geist Mono', monospace; font-size: 9px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Sequence</p>
  <h1>Case Viewer — Request Flow</h1>
  <p class="subtitle">List cases → fetch slice → render overlay + metrics (happy path)</p>

  <svg viewBox="0 0 800 440" role="img" aria-labelledby="cvseq-title cvseq-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="cvseq-title">Case Viewer Request Flow</title>
    <desc id="cvseq-desc">Time-ordered flow: the React viewer lists cases from the FastAPI router, the service parses NIfTI on first access, then a second request fetches one slice as base64 PNGs and the viewer renders the three-color overlay with volume metrics.</desc>

    <defs>
      <marker id="cvseq-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="cvseq-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
      <marker id="cvseq-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- Lifelines -->
    <line x1="80" y1="64" x2="80" y2="420" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="240" y1="64" x2="240" y2="420" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="400" y1="64" x2="400" y2="420" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="560" y1="64" x2="560" y2="420" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="720" y1="64" x2="720" y2="420" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Activation bars -->
    <rect x="236" y="100" width="8" height="120" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="236" y="244" width="8" height="96" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="396" y="100" width="8" height="120" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="396" y="244" width="8" height="96" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="556" y="124" width="8" height="72" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="556" y="268" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="716" y="148" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

    <!-- Messages -->
    <line x1="240" y1="100" x2="400" y2="100" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#cvseq-arrow-link)"/>
    <rect x="284" y="78" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="320" y="87" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /CASES</text>

    <line x1="400" y1="124" x2="560" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cvseq-arrow)"/>
    <rect x="438" y="102" width="84" height="12" rx="2" fill="#f5f5f5"/>
    <text x="480" y="111" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIST_CASES()</text>

    <line x1="560" y1="148" x2="720" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cvseq-arrow)"/>
    <rect x="600" y="126" width="80" height="12" rx="2" fill="#f5f5f5"/>
    <text x="640" y="135" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCAN · PARSE</text>

    <line x1="720" y1="172" x2="560" y2="172" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#cvseq-arrow)"/>
    <rect x="588" y="150" width="104" height="12" rx="2" fill="#f5f5f5"/>
    <text x="640" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VOLUMES · MASKS</text>

    <line x1="560" y1="196" x2="400" y2="196" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#cvseq-arrow)"/>
    <rect x="454" y="174" width="52" height="12" rx="2" fill="#f5f5f5"/>
    <text x="480" y="183" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CASES[]</text>

    <line x1="400" y1="220" x2="240" y2="220" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#cvseq-arrow)"/>
    <rect x="288" y="198" width="64" height="12" rx="2" fill="#f5f5f5"/>
    <text x="320" y="207" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 CASES</text>

    <line x1="240" y1="244" x2="400" y2="244" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#cvseq-arrow-link)"/>
    <rect x="282" y="222" width="76" height="12" rx="2" fill="#f5f5f5"/>
    <text x="320" y="231" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET SLICE Z</text>

    <line x1="400" y1="268" x2="560" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cvseq-arrow)"/>
    <rect x="432" y="246" width="96" height="12" rx="2" fill="#f5f5f5"/>
    <text x="480" y="255" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SLICE_MASK(Z)</text>

    <line x1="560" y1="292" x2="720" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cvseq-arrow)"/>
    <rect x="600" y="270" width="80" height="12" rx="2" fill="#f5f5f5"/>
    <text x="640" y="279" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ VOLUME</text>

    <line x1="560" y1="316" x2="400" y2="316" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#cvseq-arrow)"/>
    <rect x="450" y="294" width="60" height="12" rx="2" fill="#f5f5f5"/>
    <text x="480" y="303" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MASK PNG</text>

    <line x1="400" y1="340" x2="240" y2="340" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#cvseq-arrow-accent)"/>
    <rect x="260" y="318" width="120" height="12" rx="2" fill="#f5f5f5"/>
    <text x="320" y="327" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · {BASE, MASK}</text>

    <line x1="240" y1="388" x2="80" y2="388" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#cvseq-arrow)"/>
    <rect x="108" y="366" width="104" height="12" rx="2" fill="#f5f5f5"/>
    <text x="160" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RENDER OVERLAY</text>

    <!-- Actors -->
    <rect x="32" y="24" width="96" height="32" rx="6" fill="#f5f5f5"/>
    <rect x="32" y="24" width="96" height="32" rx="6" fill="rgba(79,93,117,0.10)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
    <text x="80" y="41" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>
    <text x="80" y="51" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">radiologist</text>
    <rect x="192" y="24" width="96" height="32" rx="6" fill="#f5f5f5"/>
    <rect x="192" y="24" width="96" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="240" y="41" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CaseViewer</text>
    <text x="240" y="51" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">react</text>
    <rect x="352" y="24" width="96" height="32" rx="6" fill="#f5f5f5"/>
    <rect x="352" y="24" width="96" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="41" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI</text>
    <text x="400" y="51" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">router</text>
    <rect x="512" y="24" width="96" height="32" rx="6" fill="#f5f5f5"/>
    <rect x="512" y="24" width="96" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="560" y="41" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service</text>
    <text x="560" y="51" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nibabel</text>
    <rect x="672" y="24" width="96" height="32" rx="6" fill="#f5f5f5"/>
    <rect x="672" y="24" width="96" height="32" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="720" y="41" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Data</text>
    <text x="720" y="51" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nifti files</text>
  </svg>

  <p class="colophon">Case Viewer (ticket 22) — parse cached per case · slice masks as base64 PNG · coral = happy-path payload</p>
</div>
</body>
</html>
