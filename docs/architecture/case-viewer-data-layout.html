<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Viewer — Data Layout</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --accent: #eb6c36; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'Geist', sans-serif; padding: 3rem 2rem; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: 'Instrument Serif', serif; font-size: 2.5rem; font-weight: 400; margin: 0.5rem 0 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
  svg { display: block; width: 100%; height: auto; }
  .colophon { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(45,49,66,0.12); font-family: 'Geist Mono', monospace; font-size: 9px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Tree — File Layout</p>
  <h1>Case Viewer — Data Layout</h1>
  <p class="subtitle">data/case-viewer/ · BraTS-GLI val cases (t1n + seg per case)</p>

  <svg viewBox="0 0 800 252" role="img" aria-labelledby="cvtree-title cvtree-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="cvtree-title">Case Viewer Data Layout</title>
    <desc id="cvtree-desc">A file tree: the gitignored data/case-viewer directory holds BraTS-GLI validation cases, each with a T1-native MRI volume and a three-region segmentation mask, plus additional collapsed cases.</desc>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- Connectors (before nodes) -->
    <line x1="420" y1="72" x2="420" y2="88" stroke="#4f5d75" stroke-width="1"/>
    <line x1="170" y1="88" x2="666" y2="88" stroke="#4f5d75" stroke-width="1"/>
    <line x1="170" y1="88" x2="170" y2="96" stroke="#4f5d75" stroke-width="1"/>
    <line x1="418" y1="88" x2="418" y2="96" stroke="#4f5d75" stroke-width="1"/>
    <line x1="666" y1="88" x2="666" y2="96" stroke="#4f5d75" stroke-width="1"/>

    <line x1="170" y1="140" x2="170" y2="156" stroke="#4f5d75" stroke-width="1"/>
    <line x1="110" y1="156" x2="250" y2="156" stroke="#4f5d75" stroke-width="1"/>
    <line x1="110" y1="156" x2="110" y2="164" stroke="#4f5d75" stroke-width="1"/>
    <line x1="250" y1="156" x2="250" y2="164" stroke="#4f5d75" stroke-width="1"/>

    <line x1="418" y1="140" x2="418" y2="156" stroke="#4f5d75" stroke-width="1"/>
    <line x1="358" y1="156" x2="498" y2="156" stroke="#4f5d75" stroke-width="1"/>
    <line x1="358" y1="156" x2="358" y2="164" stroke="#4f5d75" stroke-width="1"/>
    <line x1="498" y1="156" x2="498" y2="164" stroke="#4f5d75" stroke-width="1"/>

    <!-- Root (coral) -->
    <rect x="340" y="28" width="160" height="44" rx="6" fill="#f5f5f5"/>
    <rect x="340" y="28" width="160" height="44" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="420" y="50" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">data/case-viewer</text>
    <text x="420" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">gitignored</text>

    <!-- Level 1: case dirs -->
    <rect x="80" y="96" width="180" height="44" rx="6" fill="#f5f5f5"/>
    <rect x="80" y="96" width="180" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="170" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BraTS-GLI-02073-100</text>
    <text x="170" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">val case</text>
    <rect x="328" y="96" width="180" height="44" rx="6" fill="#f5f5f5"/>
    <rect x="328" y="96" width="180" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="418" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BraTS-GLI-02095-100</text>
    <text x="418" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">val case</text>
    <rect x="576" y="96" width="180" height="44" rx="6" fill="#f5f5f5"/>
    <rect x="576" y="96" width="180" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="666" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">…</text>
    <text x="666" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5 val cases · pick 3</text>

    <!-- Level 2: files -->
    <rect x="50" y="164" width="120" height="40" rx="6" fill="#f5f5f5"/>
    <rect x="50" y="164" width="120" height="40" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="110" y="188" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">…-t1n.nii.gz</text>
    <rect x="190" y="164" width="120" height="40" rx="6" fill="#f5f5f5"/>
    <rect x="190" y="164" width="120" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="250" y="188" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">…-seg.nii.gz</text>
    <rect x="298" y="164" width="120" height="40" rx="6" fill="#f5f5f5"/>
    <rect x="298" y="164" width="120" height="40" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="358" y="188" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">…-t1n.nii.gz</text>
    <rect x="438" y="164" width="120" height="40" rx="6" fill="#f5f5f5"/>
    <rect x="438" y="164" width="120" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="498" y="188" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">…-seg.nii.gz</text>
  </svg>

  <p class="colophon">t1n = T1-native volume (base image) · seg = 3-region mask (1 NCR · 2 ED · 4 ET) · dev auto-picks 3 largest tumors at parse</p>
</div>
</body>
</html>
