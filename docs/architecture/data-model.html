<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Model</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --accent: #eb6c36; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'Geist', sans-serif; padding: 3rem 2rem; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: 'Instrument Serif', serif; font-size: 2.5rem; font-weight: 400; margin: 0.5rem 0 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
  svg { display: block; width: 100%; height: auto; }
  .colophon { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(45,49,66,0.12); font-family: 'Geist Mono', monospace; font-size: 9px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">ER — Data Model</p>
  <h1>Data Model — NeuroScan</h1>
  <p class="subtitle">SQLite · SQLAlchemy ORM · User → Image → Detection · TokenBlacklist</p>

  <svg viewBox="0 0 920 600" role="img" aria-labelledby="datamodel-title datamodel-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="datamodel-title">Data Model</title>
    <desc id="datamodel-desc">An entity-relationship model: one user has many images, each image has many detections, and revoked JWT identifiers are tracked in a token blacklist.</desc>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- Relationships (before boxes) -->
    <line x1="260" y1="180" x2="380" y2="180" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="270" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">1</text>
    <text x="368" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">N</text>
    <rect x="304" y="164" width="32" height="12" rx="2" fill="#f5f5f5"/>
    <text x="320" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">has</text>

    <line x1="480" y1="332" x2="480" y2="360" stroke="#4f5d75" stroke-width="1.2"/>
    <text x="488" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">1</text>
    <text x="488" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">N</text>
    <rect x="488" y="340" width="52" height="12" rx="2" fill="#f5f5f5"/>
    <text x="514" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">contains</text>

    <!-- User -->
    <rect x="80" y="120" width="180" height="124" rx="6" fill="#f5f5f5"/>
    <rect x="80" y="120" width="180" height="124" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="88" y="126" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="110" y="135" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
    <text x="92" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">User</text>
    <text x="92" y="164" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
    <text x="92" y="180" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">email</text>
    <text x="92" y="196" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">username</text>
    <text x="92" y="212" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">hashed_password</text>
    <text x="92" y="228" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">google_id</text>

    <!-- TokenBlacklist -->
    <rect x="680" y="120" width="180" height="76" rx="6" fill="#f5f5f5"/>
    <rect x="680" y="120" width="180" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="688" y="126" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="710" y="135" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
    <text x="692" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">TokenBlacklist</text>
    <text x="692" y="164" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># jti</text>
    <text x="692" y="180" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">expires_at</text>

    <!-- Image (coral — aggregate root) -->
    <rect x="380" y="80" width="200" height="252" rx="6" fill="#f5f5f5"/>
    <rect x="380" y="80" width="200" height="252" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="388" y="86" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
    <text x="410" y="95" fill="rgba(235,108,54,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
    <text x="392" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Image</text>
    <text x="392" y="124" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
    <text x="392" y="140" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">→ user_id</text>
    <text x="392" y="156" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">original_name</text>
    <text x="392" y="172" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">stored_name</text>
    <text x="392" y="188" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">filepath</text>
    <text x="392" y="204" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">mime_type</text>
    <text x="392" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">uploaded_at</text>
    <text x="392" y="236" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">width · height</text>
    <text x="392" y="252" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">file_size</text>
    <text x="392" y="268" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">content_hash</text>
    <text x="392" y="284" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">model_type</text>
    <text x="392" y="300" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">model_version</text>
    <text x="392" y="316" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">threshold</text>

    <!-- Detection -->
    <rect x="380" y="360" width="200" height="172" rx="6" fill="#f5f5f5"/>
    <rect x="380" y="360" width="200" height="172" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="388" y="366" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="410" y="375" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
    <text x="392" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Detection</text>
    <text x="392" y="404" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
    <text x="392" y="420" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">→ image_id</text>
    <text x="392" y="436" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">label · label_name</text>
    <text x="392" y="452" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">score</text>
    <text x="392" y="468" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">x1 · y1 · x2 · y2</text>
    <text x="392" y="484" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">(bbox xyxy)</text>
  </svg>

  <p class="colophon"># = primary key · → = foreign key · Image = aggregate root (coral) · content_hash unused for caching (ticket 16)</p>
</div>
</body>
</html>
