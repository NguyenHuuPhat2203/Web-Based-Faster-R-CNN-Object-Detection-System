<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth Lifecycle</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --accent: #eb6c36; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'Geist', sans-serif; padding: 3rem 2rem; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: 'Instrument Serif', serif; font-size: 2.5rem; font-weight: 400; margin: 0.5rem 0 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
  svg { display: block; width: 100%; height: auto; }
  .colophon { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(45,49,66,0.12); font-family: 'Geist Mono', monospace; font-size: 9px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">State Machine</p>
  <h1>Auth Lifecycle — NeuroScan</h1>
  <p class="subtitle">logged out → validating → authenticated · session death returns to login</p>

  <svg viewBox="0 0 720 320" role="img" aria-labelledby="authstate-title authstate-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="authstate-title">Auth Lifecycle</title>
    <desc id="authstate-desc">A state machine: the app starts logged out, enters a validating state when a stored token is refreshed on mount, reaches authenticated after login or a successful refresh, and returns to logged out on logout or a failed refresh.</desc>

    <defs>
      <marker id="authstate-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- Transitions -->
    <line x1="42" y1="168" x2="60" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authstate-arrow)"/>

    <path d="M140,140 C 150,60 360,60 360,96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authstate-arrow)"/>
    <rect x="222" y="56" width="84" height="12" rx="2" fill="#f5f5f5"/>
    <text x="264" y="65" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOKEN ON MOUNT</text>

    <path d="M430,68 C 500,68 556,120 590,140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authstate-arrow)"/>
    <rect x="440" y="48" width="64" height="12" rx="2" fill="#f5f5f5"/>
    <text x="472" y="57" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFRESH OK</text>

    <path d="M310,96 C 280,116 160,116 130,140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authstate-arrow)"/>
    <rect x="198" y="112" width="68" height="12" rx="2" fill="#f5f5f5"/>
    <text x="232" y="121" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFRESH FAIL</text>

    <path d="M200,168 C 360,232 360,232 520,168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authstate-arrow)"/>
    <rect x="312" y="220" width="96" height="12" rx="2" fill="#f5f5f5"/>
    <text x="360" y="229" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOGIN · REGISTER</text>

    <path d="M590,196 C 360,256 360,256 130,196" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#authstate-arrow)"/>
    <rect x="296" y="244" width="128" height="12" rx="2" fill="#f5f5f5"/>
    <text x="360" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOGOUT · 401 FAIL</text>

    <!-- Start dot -->
    <circle cx="36" cy="168" r="6" fill="#2d3142"/>

    <!-- States -->
    <rect x="60" y="140" width="140" height="56" rx="8" fill="#f5f5f5"/>
    <rect x="60" y="140" width="140" height="56" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="130" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Logged out</text>
    <text x="130" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no tokens</text>

    <rect x="290" y="40" width="140" height="56" rx="8" fill="#f5f5f5"/>
    <rect x="290" y="40" width="140" height="56" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="360" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validating</text>
    <text x="360" y="82" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">mount refresh</text>

    <rect x="520" y="140" width="140" height="56" rx="8" fill="#f5f5f5"/>
    <rect x="520" y="140" width="140" height="56" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="590" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Authenticated</text>
    <text x="590" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">access + refresh</text>
  </svg>

  <p class="colophon">mid-request 401 → one refresh retry → on failure clearTokens + auth:expired → RequireAuth redirects to /login (ticket 09)</p>
</div>
</body>
</html>
