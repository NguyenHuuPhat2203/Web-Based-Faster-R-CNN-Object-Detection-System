<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predict Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --accent: #eb6c36; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'Geist', sans-serif; padding: 3rem 2rem; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: 'Instrument Serif', serif; font-size: 2.5rem; font-weight: 400; margin: 0.5rem 0 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
  svg { display: block; width: 100%; height: auto; }
  .colophon { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(45,49,66,0.12); font-family: 'Geist Mono', monospace; font-size: 9px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Sequence</p>
  <h1>Predict Request — v2</h1>
  <p class="subtitle">auth → inference → persist → 200 {status, result} (happy path)</p>

  <svg viewBox="0 0 800 360" role="img" aria-labelledby="predictseq-title predictseq-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="predictseq-title">Predict Request Flow</title>
    <desc id="predictseq-desc">Time-ordered flow: the detector posts an image, the router validates it and runs inference through the pipeline, the scan and detections are persisted, and the result is returned for rendering.</desc>

    <defs>
      <marker id="predseq-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="predseq-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      <marker id="predseq-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <line x1="80" y1="64" x2="80" y2="336" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="240" y1="64" x2="240" y2="336" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="400" y1="64" x2="400" y2="336" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="560" y1="64" x2="560" y2="336" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="720" y1="64" x2="720" y2="336" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <rect x="236" y="100" width="8" height="168" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="396" y="100" width="8" height="168" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="556" y="124" width="8" height="120" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="716" y="148" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
    <rect x="716" y="196" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

    <line x1="240" y1="100" x2="400" y2="100" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#predseq-arrow-link)"/>
    <rect x="272" y="78" width="96" height="12" rx="2" fill="#f5f5f5"/>
    <text x="320" y="87" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /V2/PREDICT</text>

    <line x1="400" y1="124" x2="560" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#predseq-arrow)"/>
    <rect x="428" y="102" width="104" height="12" rx="2" fill="#f5f5f5"/>
    <text x="480" y="111" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALIDATE · RUN</text>

    <line x1="560" y1="148" x2="720" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#predseq-arrow)"/>
    <rect x="600" y="126" width="80" height="12" rx="2" fill="#f5f5f5"/>
    <text x="640" y="135" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD</text>

    <line x1="720" y1="172" x2="560" y2="172" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#predseq-arrow)"/>
    <rect x="600" y="150" width="80" height="12" rx="2" fill="#f5f5f5"/>
    <text x="640" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>

    <line x1="560" y1="196" x2="720" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#predseq-arrow)"/>
    <rect x="592" y="174" width="96" height="12" rx="2" fill="#f5f5f5"/>
    <text x="640" y="183" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PERSIST SCAN</text>

    <line x1="720" y1="220" x2="560" y2="220" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#predseq-arrow)"/>
    <rect x="612" y="198" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="640" y="207" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVED</text>

    <line x1="560" y1="244" x2="400" y2="244" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#predseq-arrow)"/>
    <rect x="436" y="222" width="88" height="12" rx="2" fill="#f5f5f5"/>
    <text x="480" y="231" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>

    <line x1="400" y1="268" x2="240" y2="268" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#predseq-arrow-accent)"/>
    <rect x="268" y="246" width="104" height="12" rx="2" fill="#f5f5f5"/>
    <text x="320" y="255" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · {STATUS, RESULT}</text>

    <line x1="240" y1="312" x2="80" y2="312" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#predseq-arrow)"/>
    <rect x="112" y="290" width="96" height="12" rx="2" fill="#f5f5f5"/>
    <text x="160" y="299" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RENDER CANVAS</text>

    <rect x="32" y="24" width="96" height="32" rx="6" fill="#f5f5f5"/>
    <rect x="32" y="24" width="96" height="32" rx="6" fill="rgba(79,93,117,0.10)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
    <text x="80" y="41" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detector</text>
    <text x="80" y="51" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">react</text>
    <rect x="192" y="24" width="96" height="32" rx="6" fill="#f5f5f5"/>
    <rect x="192" y="24" width="96" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="240" y="41" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI</text>
    <text x="240" y="51" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">router</text>
    <rect x="352" y="24" width="96" height="32" rx="6" fill="#f5f5f5"/>
    <rect x="352" y="24" width="96" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="41" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service</text>
    <text x="400" y="51" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">orchestrate</text>
    <rect x="512" y="24" width="96" height="32" rx="6" fill="#f5f5f5"/>
    <rect x="512" y="24" width="96" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="560" y="41" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pipeline</text>
    <text x="560" y="51" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FRCNN · YOLO</text>
    <rect x="672" y="24" width="96" height="32" rx="6" fill="#f5f5f5"/>
    <rect x="672" y="24" width="96" height="32" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="720" y="41" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Storage</text>
    <text x="720" y="51" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sqlite · disk</text>
  </svg>

  <p class="colophon">v2 = full post-NMS box set (ticket 21) · persist stores all detections · coral = happy-path payload</p>
</div>
</body>
</html>
